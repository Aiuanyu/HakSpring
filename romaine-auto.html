<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romaine Auto (PoC) — 全自動客話羅馬字轉換</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --accent: #0f766e;
      --poly-bg: #fef9c3;
      --poly-border: #eab308;
      --supp-bg: #e0f2fe;
      --supp-border: #0284c7;
      --nisim-bg: #f3e8ff;
      --nisim-border: #9333ea;
      --oov-bg: #fee2e2;
      --oov-border: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #14b8a6;
        --poly-bg: #422006;
        --poly-border: #ca8a04;
        --supp-bg: #0c4a6e;
        --supp-border: #38bdf8;
        --nisim-bg: #3b0764;
        --nisim-border: #c084fc;
        --oov-bg: #450a0a;
        --oov-border: #dc2626;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px 14px;
      line-height: 1.6;
    }
    .container { max-width: none; width: 100%; margin: 0 auto; display: grid; gap: 16px; align-items: start; }
    .main-col { display: grid; gap: 16px; min-width: 0; }
    @media (min-width: 980px) {
      .container { grid-template-columns: minmax(340px, 1fr) minmax(560px, 964px); }
      .cert-loader {
        position: sticky;
        top: 12px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .cert-loader .cert-sent-list {
        max-height: calc(100vh - 260px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 110px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      resize: vertical;
    }
    button, select {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .tokens-wrap { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }
    .tok-chip {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .tok-chip.poly { background: var(--poly-bg); border-color: var(--poly-border); }
    .tok-chip.supp-derived { background: var(--supp-bg); border-color: var(--supp-border); }
    .tok-chip.supp-nisim { background: var(--nisim-bg); border-color: var(--nisim-border); border-style: dotted; }
    .tok-chip.oov { background: var(--oov-bg); border-color: var(--oov-border); border-style: dashed; }
    .tok-chip.uncertain { box-shadow: 0 0 0 2px #f97316; }
    .tok-chip.comment {
      background: rgba(128,128,128,0.12);
      border-style: dashed;
      color: var(--muted);
      cursor: default;
      font-size: 12px;
      justify-content: center;
    }
    .tok-chip.punct { border-color: transparent; cursor: default; padding: 4px 2px; }
    .tok-han { font-size: 15px; font-weight: 600; }
    .tok-hpp { font-size: 13px; color: var(--muted); }
    .tok-badge {
      font-size: 10px;
      padding: 0 4px;
      border-radius: 4px;
      background: rgba(128,128,128,0.18);
      margin-left: 4px;
      vertical-align: middle;
    }
    .tok-case-btn {
      display: none;
      position: absolute;
      top: -10px;
      right: -8px;
      min-width: 24px;
      height: 22px;
      padding: 0 6px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 20px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 20;
    }
    .tok-chip:hover .tok-case-btn,
    .tok-chip.is-hovered .tok-case-btn {
      display: inline-block;
    }
    .verified-list { display: grid; gap: 10px; margin-top: 10px; }
    .verified-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--bg);
      display: grid;
      gap: 4px;
    }
    .verified-item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .verified-item-han { font-weight: 600; font-size: 15px; }
    .verified-item-hpp { font-size: 14px; color: var(--muted); word-break: break-word; }
    .output-box {
      white-space: pre-wrap;
      font-size: 17px;
      padding: 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      min-height: 56px;
    }
    .status-line { font-size: 13px; color: var(--muted); }
    .hint-line { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .popup {
      position: fixed;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 100;
      display: none;
      min-width: 210px;
      max-height: 320px;
      overflow-y: auto;
    }
    .popup button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; margin-top: 4px; }
    .cand-tag { font-size: 11px; color: var(--muted); }
    .cand-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .cand-ext-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .cand-ext-link:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    @media (prefers-color-scheme: dark) {
      .cand-ext-link:hover { color: #0f172a; }
    }
    .dict-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .dict-modal-dialog {
      width: min(1060px, 96vw);
      height: min(88vh, 860px);
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .dict-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .dict-modal-title { font-size: 16px; font-weight: 700; }
    .dict-modal-actions { display: flex; align-items: center; gap: 8px; }
    .dict-modal-ext {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .dict-modal-ext:hover { text-decoration: underline; }
    .dict-modal-cands {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .dict-cand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
    }
    .dict-cand-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    .dict-cand-pill.active .cand-tag { color: rgba(255,255,255,0.88); }
    @media (prefers-color-scheme: dark) {
      .dict-cand-pill.active { color: #0f172a; }
      .dict-cand-pill.active .cand-tag { color: #0f172a; }
    }
    .dict-modal-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: var(--bg);
    }
    .cert-loader summary { cursor: pointer; font-weight: 600; font-size: 14px; }
    .cert-loader-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .cert-active-meta {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 13px;
    }
    .cert-sent-list {
      margin-top: 8px;
      max-height: 210px;
      overflow-y: auto;
      display: grid;
      gap: 6px;
    }
    .cert-sent-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      font-size: 15px;
    }
    .cert-sent-row.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .cert-sent-row.verified {
      background: #ecfdf5;
      border-color: #16a34a;
    }
    .cert-verified-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #15803d;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      vertical-align: middle;
    }
    @media (prefers-color-scheme: dark) {
      .cert-sent-row.verified {
        background: #052e16;
        border-color: #22c55e;
      }
      .cert-verified-badge {
        background: #4ade80;
        color: #052e16;
      }
    }
    .cert-sent-text { flex: 1; min-width: 0; }
    .cert-sent-main { font-size: 16px; font-weight: 600; line-height: 1.5; }
    .cert-sent-row.unverified-italic:not(.verified) .cert-sent-main { font-style: italic; }
    .cert-sent-hpp { font-size: 15px; color: var(--accent); font-weight: 600; margin-top: 4px; line-height: 1.85; word-break: break-word; }
    .radio-group { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); }
    .radio-group label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 600; }
    .cert-sent-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
    .cert-audio-btn { padding: 4px 8px; font-size: 13px; line-height: 1.2; }
    .cert-audio-btn.playing { background: var(--accent); color: #fff; border-color: var(--accent); }
    .output-box ruby[class^="sandhi-"],
    .cert-sent-hpp ruby[class^="sandhi-"] { ruby-position: over; font-weight: 500; }
    .output-box ruby[class^="sandhi-"] rt,
    .cert-sent-hpp ruby[class^="sandhi-"] rt { font-size: 0.65em; font-weight: 700; color: inherit; }
    ruby.sandhi-t55 { color: #dc2626; }
    ruby.sandhi-t35 { color: #9333ea; }
    ruby.sandhi-t33 { color: #2563eb; }
    ruby.sandhi-t2 { color: #15803d; }
    ruby.sandhi-t11 { color: #c84c09; }
    ruby.sandhi-t5 { color: #0f766e; }
    ruby.sandhi-t3 { color: #9a3412; }
    ruby.sandhi-t53 { color: #be185d; }
    ruby.sandhi-none { color: inherit; }
    ruby.sandhi-none rt { color: var(--muted); font-weight: 500; }
    @media (prefers-color-scheme: dark) {
      ruby.sandhi-t55 { color: #ff8a80; }
      ruby.sandhi-t35 { color: #c4b5fd; }
      ruby.sandhi-t33 { color: #93c5fd; }
      ruby.sandhi-t2 { color: #86efac; }
      ruby.sandhi-t11 { color: #ffb74d; }
      ruby.sandhi-t5 { color: #5eead4; }
      ruby.sandhi-t3 { color: #fdba74; }
      ruby.sandhi-t53 { color: #f48fb1; }
      .cert-audio-btn.playing { color: #0f172a; }
    }
  </style>
</head>
<body>
  <div class="container">
    <details class="card cert-loader" id="certLoaderCard" open>
      <summary>CERT 認證例句載入器（邊學邊測）</summary>
      <div class="cert-loader-controls">
        <select id="certLevelSelect" title="級別"></select>
        <select id="certCategorySelect" title="分類"></select>
        <button type="button" id="certPrevBtn">◀ 上一句</button>
        <button type="button" id="certNextBtn">下一句 ▶</button>
        <span class="status-line" id="certCounter"></span>
      </div>
      <div class="cert-active-meta" id="certActiveMeta" style="display:none"></div>
      <div class="cert-sent-list" id="certSentList"></div>
    </details>

    <div class="main-col">
    <div class="card">
      <h2 style="margin:0 0 8px">Romaine Auto PoC（多腔詞典／例句測試）</h2>
      <div class="toolbar">
        <select id="dialectSelect" title="選擇腔調">
          <option value="sixian">四縣</option>
          <option value="zhaoan">詔安</option>
        </select>
        <label class="switch">
          <input type="checkbox" id="autoToggle" checked />
          全自動即時產生
        </label>
        <select id="joiningMode">
          <option value="none">連寫（標準 HPP）</option>
          <option value="hyphen">連字號（-）</option>
          <option value="space">空格（　）</option>
        </select>
        <button class="primary" id="runBtn">立即轉換</button>
        <button id="loadSampleBtn">載入 P0 範例</button>
        <button id="evalP0Btn">跑 P0 基準分</button>
      </div>
      <div class="status-line" id="statusLine" style="margin-top:8px">詞庫（教典＋認證＋補字典）載入中…</div>
      <div class="toolbar" style="margin-top:8px; gap:14px;">
        <div class="radio-group" role="radiogroup" aria-label="無愛變調个標示字元">
          <span>無愛變調个標示字元：</span>
          <label><input type="radio" name="noSandhiMarker" value="#" /> <code>#</code></label>
          <label><input type="radio" name="noSandhiMarker" value="~" checked /> <code>~</code></label>
        </div>
        <label class="switch" style="font-size:13px; font-weight:500;">
          <input type="checkbox" id="unverifiedItalicToggle" checked />
          毋曾有人審查過个句仔用竵體／斜體
        </label>
        <label class="switch" style="font-size:13px; font-weight:500;">
          <input type="checkbox" id="trustUnderlineToggle" />
          用底線表示例句羅馬字个可信度
        </label>
      </div>
      <div class="hint-line">
        即時造詞控制符：<code>輕-井-澤</code> 強制連詞 ｜ <code>美=臺</code> 強制連字號（<code>-</code>）｜ <code>頭那+毛</code> 輸出加空格（不改斷詞）｜ <code>恁 早</code> 空格拆詞 ｜ <code>字~</code>／<code>字#</code> 前音節不變調
      </div>
    </div>

    <div class="card">
      <textarea id="inputHan" placeholder="輸入客話諸夏字…（試看：輕-井-澤、美=臺、恁+早、妳）"></textarea>
    </div>

    <div class="card">
      <div class="status-line" style="margin-bottom:8px">
        色標說明：黃底＝多音詞條 ｜ 藍底「補」＝補字典（拆音／沿襲・參考）｜ 紫點線「擬」＝廣韻擬音（參考）｜ 紅虛線＝未收錄 ｜ 橘框「？」＝已標記不確定
      </div>
      <div class="tokens-wrap" id="tokensWrap"></div>
    </div>

    <div class="card">
      <div class="toolbar" style="margin-bottom:8px; justify-content:space-between">
        <div class="toolbar">
          <strong>HagPinPlus 輸出</strong>
          <label class="switch" style="font-size:13px;font-weight:500">
            <input type="checkbox" id="sandhiToggle" checked />
            顯示變調 (Sandhi)
          </label>
        </div>
        <div class="toolbar">
          <button id="copyBtn">複製結果</button>
          <button class="primary" id="verifyBtn">✓ 確認校正並入庫（localStorage）</button>
          <button id="saveAsNewBtn" style="display:none">另存別筆</button>
          <button id="toggleVerifiedBtn">檢視黃金語料 (<span id="verifiedCount">0</span>)</button>
          <button id="importBtn" type="button">匯入 JSON</button>
          <input type="file" id="importFileInput" accept=".json,application/json" style="display:none" />
          <button id="exportBtn">匯出 JSON</button>
        </div>
      </div>
      <div class="output-box" id="outputHpp"></div>
      <div style="margin-top:10px;">
        <textarea id="noteInput" rows="2" style="min-height:48px;font-size:14px;" placeholder="註解／校對備註（僅記入黃金語料，不影響轉換）"></textarea>
      </div>
      <div class="hint-line" id="exportReminder" style="margin-top:8px;"></div>
    </div>

    <div class="card" id="verifiedPanel" style="display:none">
      <div class="toolbar" style="justify-content:space-between">
        <strong>已存黃金語料（localStorage）</strong>
        <button id="clearVerifiedBtn">清空全部</button>
      </div>
      <div class="verified-list" id="verifiedList"></div>
    </div>
    </div>
  </div>

  <div class="popup" id="candPopup"></div>

  <div class="dict-modal-overlay" id="dictModal" role="dialog" aria-modal="true" aria-labelledby="dictModalTitle">
    <div class="dict-modal-dialog">
      <div class="dict-modal-header">
        <span class="dict-modal-title" id="dictModalTitle">客源翠詞典查詢</span>
        <div class="dict-modal-actions">
          <a class="dict-modal-ext" id="dictModalExtLink" href="#" target="_blank" rel="noopener">在新分頁開啟 ↗</a>
          <button type="button" id="dictModalCloseBtn">✕ 關閉</button>
        </div>
      </div>
      <div class="dict-modal-cands" id="dictModalCands" style="display:none"></div>
      <iframe class="dict-modal-frame" id="dictModalFrame" title="客源翠詞典查詢結果"></iframe>
    </div>
  </div>

  <script src="exclusions.js"></script>
  <script src="NAmedias.js"></script>
  <script src="js/gip-converter.js"></script>
  <script src="js/romaine-join.js"></script>
  <script src="js/romaine-auto.js?v=14"></script>
  <script>
    const STORAGE_KEY = 'romaineAutoVerifiedCorpus';
    const CJK_CHAR_TEST_RE = /[\u4e00-\u9fff\u3400-\u4dbf\u{20000}-\u{2ebef}]/u;
    const engine = new RomaineAutoEngine();
    let currentTokens = [];
    let prevPureCjk = [];
    // Map<pureCjkIndex, { ch: string, syl?: string, isUpper?: boolean }>
    let manualCharOverrides = new Map();

    const dialectSelect = document.getElementById('dialectSelect');
    const autoToggle = document.getElementById('autoToggle');
    const sandhiToggle = document.getElementById('sandhiToggle');
    const joiningMode = document.getElementById('joiningMode');
    const unverifiedItalicToggle = document.getElementById('unverifiedItalicToggle');
    const trustUnderlineToggle = document.getElementById('trustUnderlineToggle');
    const noSandhiMarkerRadios = Array.from(document.querySelectorAll('input[name="noSandhiMarker"]'));

    function syncRomainePrefsUI() {
      const marker = RomaineAutoEngine.getNoSandhiMarker();
      for (const r of noSandhiMarkerRadios) {
        r.checked = r.value === marker;
      }
      if (unverifiedItalicToggle) {
        unverifiedItalicToggle.checked = RomaineAutoEngine.getUnverifiedItalic();
      }
      if (trustUnderlineToggle) {
        trustUnderlineToggle.checked = RomaineAutoEngine.getTrustUnderline();
      }
    }
    syncRomainePrefsUI();

    for (const r of noSandhiMarkerRadios) {
      r.addEventListener('change', () => {
        if (r.checked) {
          RomaineAutoEngine.setNoSandhiMarker(r.value);
          render();
          refreshCertVerifiedHighlights();
        }
      });
    }
    if (unverifiedItalicToggle) {
      unverifiedItalicToggle.addEventListener('change', () => {
        RomaineAutoEngine.setUnverifiedItalic(unverifiedItalicToggle.checked);
        refreshCertVerifiedHighlights();
      });
    }
    if (trustUnderlineToggle) {
      trustUnderlineToggle.addEventListener('change', () => {
        RomaineAutoEngine.setTrustUnderline(trustUnderlineToggle.checked);
      });
    }
    window.addEventListener('romainePrefsChanged', () => {
      syncRomainePrefsUI();
      render();
      refreshCertVerifiedHighlights();
    });
    const inputHan = document.getElementById('inputHan');
    const noteInput = document.getElementById('noteInput');
    const tokensWrap = document.getElementById('tokensWrap');
    const outputHpp = document.getElementById('outputHpp');
    const statusLine = document.getElementById('statusLine');
    const candPopup = document.getElementById('candPopup');
    const verifiedCountEl = document.getElementById('verifiedCount');

    function openDictSearchModal(word, tokIdx, subPartMeta) {
      const tok = currentTokens[tokIdx];
      if (!tok || !word) return;
      const searchUrl = `index.html?musiid=hak&ca=${encodeURIComponent(word)}&kiong=${engine.kiong}`;
      dictModalTitle.textContent = `客源翠客文尋「${word}」（${engine.dialectLabel}）`;
      dictModalExtLink.href = searchUrl;

      const cands = subPartMeta ? subPartMeta.candidates : tok.candidates;
      dictModalCands.innerHTML = '';
      if (cands && cands.length > 0) {
        const lbl = document.createElement('span');
        lbl.style.color = 'var(--muted)';
        lbl.textContent = '選用讀音：';
        dictModalCands.appendChild(lbl);

        const renderPills = () => {
          for (const old of dictModalCands.querySelectorAll('.dict-cand-pill')) old.remove();
          for (const c of cands) {
            const pill = document.createElement('button');
            pill.type = 'button';
            let isActive = false;
            if (subPartMeta) {
              const offset = tok.partsMeta
                .slice(0, tok.partsMeta.indexOf(subPartMeta))
                .reduce((s, pm) => s + pm.sylCount, 0);
              const curSlice = (tok.hpp || '').trim().split(/\s+/).slice(offset, offset + subPartMeta.sylCount).join(' ').toLowerCase();
              isActive = curSlice === c.hpp.toLowerCase();
            } else {
              isActive = (tok.hpp || '').trim().toLowerCase() === c.hpp.toLowerCase();
            }
            pill.className = 'dict-cand-pill' + (isActive ? ' active' : '');
            const txt = document.createElement('span');
            txt.textContent = engine.formatWordHpp(c.hpp, joiningMode.value, subPartMeta ? undefined : tok.sylBoundaries);
            const tag = document.createElement('span');
            tag.className = 'cand-tag';
            tag.textContent = c.label;
            pill.appendChild(txt);
            pill.appendChild(tag);
            pill.onclick = () => {
              if (subPartMeta) {
                const offset = tok.partsMeta
                  .slice(0, tok.partsMeta.indexOf(subPartMeta))
                  .reduce((s, pm) => s + pm.sylCount, 0);
                const curSyls = (tok.hpp || '').trim().split(/\s+/).filter(Boolean);
                const repSyls = c.hpp.trim().split(/\s+/).filter(Boolean);
                for (let k = 0; k < subPartMeta.sylCount && k < repSyls.length; k++) {
                  const oldSyl = curSyls[offset + k] || '';
                  const wasUpper = oldSyl && oldSyl.charAt(0) !== oldSyl.charAt(0).toLowerCase();
                  curSyls[offset + k] = wasUpper
                    ? repSyls[k].charAt(0).toUpperCase() + repSyls[k].slice(1)
                    : repSyls[k];
                }
                tok.hpp = curSyls.join(' ');
              } else {
                const oldFirst = (tok.hpp || '').trim().charAt(0);
                const wasUpper = oldFirst && oldFirst !== oldFirst.toLowerCase();
                tok.hpp = wasUpper ? c.hpp.charAt(0).toUpperCase() + c.hpp.slice(1) : c.hpp;
                tok.trust = c.trust;
                tok.label = c.label;
                tok.oov = false;
              }
              recordTokenManualOverride(tokIdx, true, false);
              render();
              renderPills();
            };
            dictModalCands.appendChild(pill);
          }
        };
        renderPills();
        dictModalCands.style.display = 'flex';
      } else {
        dictModalCands.style.display = 'none';
      }

      dictModalFrame.src = searchUrl;
      dictModal.style.display = 'flex';
    }

    function loadVerified() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }
    function updateVerifiedBadge() {
      const list = loadVerified();
      verifiedCountEl.textContent = String(list.length);
      const reminderEl = document.getElementById('exportReminder');
      if (reminderEl) {
        const certCnt = list.filter((it) => it.cert_ref && it.cert_ref.id).length;
        const stat = list.length
          ? `目前已暫存 ${list.length} 筆（含 ${certCnt} 筆客源翠認證例句）`
          : '目前尚無本機暫存';
        reminderEl.textContent = `💡 localStorage 即時學習僅存於本機瀏覽器（${stat}）；校正成果、註解與 # + - = 標記日後須按「匯出 JSON」交由專案合併，才會成為主站顯示資產與測試集。`;
      }
    }

    function extractPureCjkChars(tokens) {
      const list = [];
      for (const tok of tokens) {
        if (tok.punct || tok.nonCjk) continue;
        for (const ch of Array.from(tok.han || '')) {
          if (CJK_CHAR_TEST_RE.test(ch)) list.push(ch);
        }
      }
      return list;
    }

    /** 依 LCS 將舊純諸夏字索引上的手動選擇，對齊移轉至新純諸夏字索引 */
    function remapOverrides(oldChars, oldMap, newChars) {
      const remapped = new Map();
      if (!oldMap.size || !oldChars.length || !newChars.length) return remapped;
      const m = oldChars.length, n = newChars.length;
      const dp = Array.from({ length: m + 1 }, () => new Uint32Array(n + 1));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          dp[i][j] = oldChars[i - 1] === newChars[j - 1]
            ? dp[i - 1][j - 1] + 1
            : Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
      let i = m, j = n;
      while (i > 0 && j > 0) {
        if (oldChars[i - 1] === newChars[j - 1]) {
          const ov = oldMap.get(i - 1);
          if (ov) remapped.set(j - 1, ov);
          i--; j--;
        } else if (dp[i - 1][j] >= dp[i][j - 1]) {
          i--;
        } else {
          j--;
        }
      }
      return remapped;
    }

    /** 將記憶的手動讀音與大小寫套回 newly segmented tokens */
    function applyOverridesToTokens(tokens, ovMap) {
      let cjkIdx = 0;
      for (const tok of tokens) {
        if (tok.punct || tok.nonCjk) continue;
        const chars = Array.from(tok.han || '').filter((c) => CJK_CHAR_TEST_RE.test(c));
        const syls = (tok.hpp || '').trim().split(/\s+/).filter(Boolean);
        let changed = false;
        for (let k = 0; k < chars.length; k++) {
          const ov = ovMap.get(cjkIdx + k);
          if (ov && ov.ch === chars[k] && syls[k]) {
            if (ov.syl) {
              syls[k] = ov.syl;
              changed = true;
            }
            if (ov.isUpper !== undefined) {
              syls[k] = ov.isUpper
                ? syls[k].charAt(0).toUpperCase() + syls[k].slice(1)
                : syls[k].charAt(0).toLowerCase() + syls[k].slice(1);
              changed = true;
            }
          }
        }
        if (changed) {
          tok.hpp = syls.join(' ');
          tok.oov = false;
        }
        if (chars.some((_, k) => ovMap.get(cjkIdx + k)?.uncertain)) {
          tok.uncertain = true;
        }
        cjkIdx += chars.length;
      }
    }

    /** 當使用者手動改動某個 token 時，更新對應純諸夏字索引的手動覆寫表 */
    function recordTokenManualOverride(tokIdx, recordReading, recordCase, recordUncertain) {
      let cjkIdx = 0;
      for (let t = 0; t < currentTokens.length; t++) {
        const tok = currentTokens[t];
        if (tok.punct || tok.nonCjk) continue;
        const chars = Array.from(tok.han || '').filter((c) => CJK_CHAR_TEST_RE.test(c));
        if (t === tokIdx) {
          const syls = (tok.hpp || '').trim().split(/\s+/).filter(Boolean);
          for (let k = 0; k < chars.length; k++) {
            const prevOv = manualCharOverrides.get(cjkIdx + k) || { ch: chars[k] };
            if (recordReading && syls[k]) prevOv.syl = syls[k].toLowerCase();
            if (recordCase && syls[k]) {
              const fc = syls[k].charAt(0);
              prevOv.isUpper = fc !== fc.toLowerCase();
            }
            if (recordUncertain) prevOv.uncertain = !!tok.uncertain;
            manualCharOverrides.set(cjkIdx + k, prevOv);
          }
          break;
        }
        cjkIdx += chars.length;
      }
      prevPureCjk = extractPureCjkChars(currentTokens);
    }

    function render() {
      tokensWrap.innerHTML = '';
      currentTokens.forEach((tok, idx) => {
        if (tok.han === '\n' || tok.isSpace) return;
        const chip = document.createElement('div');
        if (tok.isComment) {
          chip.className = 'tok-chip comment';
          chip.textContent = tok.han;
          chip.title = '註解（僅記入黃金語料，不予轉換）';
          tokensWrap.appendChild(chip);
          return;
        }
        let cls = 'tok-chip';
        if (tok.punct || tok.nonCjk) cls += ' punct';
        else if (tok.oov) cls += ' oov';
        else if (tok.trust === 'supp-nisim') cls += ' supp-nisim';
        else if (tok.trust === 'supp-derived') cls += ' supp-derived';
        else if (tok.isPolyphone) cls += ' poly';
        if (tok.uncertain) cls += ' uncertain';
        chip.className = cls;
        if (tok.label && !tok.punct && !tok.nonCjk) chip.title = tok.label;

        const hanEl = document.createElement('span');
        hanEl.className = 'tok-han';
        hanEl.textContent = tok.displayHan || tok.han;
        if (!tok.punct && !tok.nonCjk && tok.trust === 'supp-derived') {
          const b = document.createElement('span');
          b.className = 'tok-badge';
          b.textContent = '補';
          hanEl.appendChild(b);
        } else if (!tok.punct && !tok.nonCjk && tok.trust === 'supp-nisim') {
          const b = document.createElement('span');
          b.className = 'tok-badge';
          b.textContent = '擬';
          hanEl.appendChild(b);
        }
        if (!tok.punct && !tok.nonCjk && tok.isPolyphone) {
          const pb = document.createElement('span');
          pb.className = 'tok-badge';
          const cnt = tok.candidates && tok.candidates.length > 1
            ? tok.candidates.length
            : (tok.partsMeta || []).reduce((s, pm) => Math.max(s, (pm.candidates || []).length), 0);
          pb.textContent = `${cnt}音▾`;
          hanEl.appendChild(pb);
        }
        if (!tok.punct && !tok.nonCjk && tok.uncertain) {
          const ub = document.createElement('span');
          ub.className = 'tok-badge';
          ub.style.cssText = 'background:#f97316;color:#fff;';
          ub.textContent = '？';
          hanEl.appendChild(ub);
        }
        chip.appendChild(hanEl);

        if (!tok.punct && !tok.nonCjk) {
          const hppEl = document.createElement('span');
          hppEl.className = 'tok-hpp';
          hppEl.textContent = engine.formatWordHpp(tok.hpp, joiningMode.value, tok.sylBoundaries);
          chip.appendChild(hppEl);

          // Hover U / l 快速切換大細寫鈕
          const firstCh = (tok.hpp || '').trim().charAt(0);
          const isCurUpper = firstCh && firstCh !== firstCh.toLowerCase();
          const caseBtn = document.createElement('button');
          caseBtn.type = 'button';
          caseBtn.className = 'tok-case-btn';
          caseBtn.textContent = isCurUpper ? 'l' : 'U';
          caseBtn.title = isCurUpper ? '改為小寫 (l)' : '改為大寫 (U)';
          caseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTokenCase(idx);
          });
          chip.appendChild(caseBtn);

          chip.addEventListener('click', (e) => openTokenPopup(idx, e));
        }
        tokensWrap.appendChild(chip);
      });
      if (sandhiToggle.checked) {
        outputHpp.innerHTML = engine.formatTokensToSandhiHtml(currentTokens, joiningMode.value);
      } else {
        outputHpp.textContent = engine.formatTokensToHpp(currentTokens, joiningMode.value);
      }
    }

    function openTokenPopup(idx, event) {
      event.stopPropagation();
      const tok = currentTokens[idx];
      const createExtLink = (word) => {
        const a = document.createElement('a');
        a.className = 'cand-ext-link';
        a.href = `index.html?musiid=hak&ca=${encodeURIComponent(word)}&kiong=${engine.kiong}`;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = '↗';
        a.title = `另開網頁查客源翠「${word}」結果（${engine.dialectLabel}）`;
        a.addEventListener('click', (e) => e.stopPropagation());
        return a;
      };

      candPopup.innerHTML = '';
      const head = document.createElement('div');
      head.className = 'cand-head';
      const titleSpan = document.createElement('span');
      titleSpan.style.fontWeight = '600';
      titleSpan.innerHTML = `${tok.displayHan || tok.han} <span class="cand-tag">${tok.label || ''}</span>`;
      head.appendChild(titleSpan);
      head.appendChild(createExtLink(tok.han));
      candPopup.appendChild(head);

      if (tok.candidates && tok.candidates.length > 0) {
        for (const c of tok.candidates) {
          const btn = document.createElement('button');
          const txt = document.createElement('span');
          txt.textContent = engine.formatWordHpp(c.hpp, joiningMode.value, tok.sylBoundaries);
          const tag = document.createElement('span');
          tag.className = 'cand-tag';
          tag.textContent = c.label;
          btn.appendChild(txt);
          btn.appendChild(tag);
          btn.onclick = () => {
            const oldFirst = (tok.hpp || '').trim().charAt(0);
            const wasUpper = oldFirst && oldFirst !== oldFirst.toLowerCase();
            tok.hpp = wasUpper ? c.hpp.charAt(0).toUpperCase() + c.hpp.slice(1) : c.hpp;
            tok.trust = c.trust;
            tok.label = c.label;
            tok.oov = false;
            recordTokenManualOverride(idx, true, false);
            candPopup.style.display = 'none';
            render();
          };
          candPopup.appendChild(btn);
        }
      }

      // 若是強制連詞／hyphen 詞組，也展開各子詞的多音候選
      if (tok.partsMeta && tok.partsMeta.length > 1) {
        let sylOffset = 0;
        for (const pm of tok.partsMeta) {
          const offset = sylOffset;
          sylOffset += pm.sylCount;
          if (!pm.candidates || pm.candidates.length <= 1) continue;
          const hdr = document.createElement('div');
          hdr.className = 'cand-head';
          hdr.style.cssText = 'font-size:12px;color:var(--muted);margin-top:6px;border-top:1px solid var(--border);padding-top:4px;';
          const subLbl = document.createElement('span');
          subLbl.textContent = `子詞「${pm.han}」讀音：`;
          hdr.appendChild(subLbl);
          hdr.appendChild(createExtLink(pm.han));
          candPopup.appendChild(hdr);
          for (const c of pm.candidates) {
            const btn = document.createElement('button');
            const txt = document.createElement('span');
            txt.textContent = engine.formatWordHpp(c.hpp, joiningMode.value);
            const tag = document.createElement('span');
            tag.className = 'cand-tag';
            tag.textContent = c.label;
            btn.appendChild(txt);
            btn.appendChild(tag);
            btn.onclick = () => {
              const curSyls = (tok.hpp || '').trim().split(/\s+/).filter(Boolean);
              const repSyls = c.hpp.trim().split(/\s+/).filter(Boolean);
              for (let k = 0; k < pm.sylCount && k < repSyls.length; k++) {
                const oldSyl = curSyls[offset + k] || '';
                const wasUpper = oldSyl && oldSyl.charAt(0) !== oldSyl.charAt(0).toLowerCase();
                curSyls[offset + k] = wasUpper
                  ? repSyls[k].charAt(0).toUpperCase() + repSyls[k].slice(1)
                  : repSyls[k];
              }
              tok.hpp = curSyls.join(' ');
              recordTokenManualOverride(idx, true, false);
              candPopup.style.display = 'none';
              render();
            };
            candPopup.appendChild(btn);
          }
        }
      }

      const capBtn = document.createElement('button');
      capBtn.textContent = '切換首字母大寫 (Aa)';
      capBtn.onclick = () => {
        toggleTokenCase(idx);
        candPopup.style.display = 'none';
      };
      candPopup.appendChild(capBtn);

      const uncertainBtn = document.createElement('button');
      uncertainBtn.textContent = tok.uncertain ? '✓ 取消「不確定」標記' : '？ 標記為「不確定」';
      uncertainBtn.onclick = () => {
        tok.uncertain = !tok.uncertain;
        recordTokenManualOverride(idx, false, false, true);
        candPopup.style.display = 'none';
        render();
      };
      candPopup.appendChild(uncertainBtn);

      const customBtn = document.createElement('button');
      customBtn.textContent = '自訂讀音…';
      customBtn.onclick = () => {
        // 帶出目前讀音，若有 '=' 強制 hyphen 則顯示 '=' 方便直接編輯
        const curSyls = (tok.hpp || '').trim().split(/\s+/).filter(Boolean);
        let defaultInput = curSyls[0] || '';
        for (let i = 1; i < curSyls.length; i++) {
          const isEq = tok.sylBoundaries && tok.sylBoundaries[i - 1] === 'hyphen';
          defaultInput += (isEq ? '=' : ' ') + curSyls[i];
        }

        const val = prompt(
          `輸入「${tok.displayHan || tok.han}」的 HPP 讀音（空格/-/' 分隔音節；= 強制 hyphen；+ 強制空格拆詞）：`,
          defaultInput
        );
        if (val !== null && val.trim()) {
          // 解析音節與其間的結構符號（= 或 +）
          const rawParts = val.trim().split(/(\s*=\s*|\s*\+\s*|[\s'-]+)/).filter((p) => p && !/^\s+$/.test(p));
          const newSyls = [];
          const newOps = [];
          for (const part of rawParts) {
            if (/^[\s'-]+$/.test(part)) continue;
            if (part.includes('=')) {
              newOps.push('=');
            } else if (part.includes('+')) {
              newOps.push('+');
            } else {
              if (newSyls.length > newOps.length) newOps.push('normal');
              newSyls.push(part.normalize('NFC'));
            }
          }

          const chars = Array.from(tok.han || '');
          const hadEq = tok.sylBoundaries && tok.sylBoundaries.includes('hyphen');
          const hasNewStruct = newOps.includes('=') || newOps.includes('+') || hadEq;

          if (newSyls.length > 0) {
            tok.hpp = newSyls.join(' ');
            tok.oov = false;
            tok.trust = 'official';
            tok.label = '人工自訂';
            recordTokenManualOverride(idx, true, true);

            // 若有 '=' / '+' 結構變化且可對應到 textarea 原文位置，反推回 textarea 並重跑斷詞
            if (
              hasNewStruct &&
              newSyls.length === chars.length &&
              tok.srcStart !== undefined &&
              tok.srcEnd !== undefined
            ) {
              const oldDisp = tok.displayHan || tok.han;
              let rebuilt = chars[0];
              for (let k = 1; k < chars.length; k++) {
                const op = newOps[k - 1];
                if (op === '=' || op === '+') {
                  rebuilt += op;
                } else if (oldDisp.includes('-')) {
                  // 保留原有的 '-' 強制連詞符號
                  rebuilt += '-';
                }
                rebuilt += chars[k];
              }
              if (rebuilt !== oldDisp) {
                const txt = inputHan.value;
                inputHan.value = txt.slice(0, tok.srcStart) + rebuilt + txt.slice(tok.srcEnd);
                candPopup.style.display = 'none';
                runConvert();
                return;
              }
            }
            render();
          }
        }
        candPopup.style.display = 'none';
      };
      candPopup.appendChild(customBtn);

      candPopup.style.left = Math.min(event.clientX, window.innerWidth - 230) + 'px';
      candPopup.style.top = Math.min(event.clientY + 8, window.innerHeight - 260) + 'px';
      candPopup.style.display = 'block';
    }

    document.addEventListener('click', () => { candPopup.style.display = 'none'; });

    tokensWrap.addEventListener('pointerover', (e) => {
      const chip = e.target.closest('.tok-chip:not(.punct)');
      if (!chip) return;
      for (const el of tokensWrap.querySelectorAll('.tok-chip.is-hovered')) {
        if (el !== chip) el.classList.remove('is-hovered');
      }
      chip.classList.add('is-hovered');
    });
    tokensWrap.addEventListener('pointerout', (e) => {
      const chip = e.target.closest('.tok-chip:not(.punct)');
      if (!chip) return;
      if (!e.relatedTarget || !chip.contains(e.relatedTarget)) {
        chip.classList.remove('is-hovered');
      }
    });

    function runConvert() {
      if (!engine.ready) return;
      const newTokens = engine.segmentAndConvert(inputHan.value);
      const newPureCjk = extractPureCjkChars(newTokens);
      manualCharOverrides = remapOverrides(prevPureCjk, manualCharOverrides, newPureCjk);
      applyOverridesToTokens(newTokens, manualCharOverrides);
      currentTokens = newTokens;
      prevPureCjk = newPureCjk;
      render();
    }

    inputHan.addEventListener('input', () => {
      if (activeCertRef) {
        const curPure = Array.from(inputHan.value.replace(/%%[\s\S]*?%%/g, '')).filter((c) => CJK_CHAR_TEST_RE.test(c)).join('');
        if (curPure !== activeCertRef.pureCjk) {
          activeCertRef = null;
        }
      }
      if (autoToggle.checked) runConvert();
    });
    sandhiToggle.addEventListener('change', () => {
      render();
      refreshCertVerifiedHighlights();
    });
    joiningMode.addEventListener('change', () => {
      render();
      refreshCertVerifiedHighlights();
    });
    document.getElementById('runBtn').addEventListener('click', runConvert);

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const plain = engine.formatTokensToHpp(currentTokens, joiningMode.value);
      await navigator.clipboard.writeText(plain);
      statusLine.textContent = '已複製 HagPinPlus 結果。';
    });

    document.getElementById('loadSampleBtn').addEventListener('click', async () => {
      activeCertRef = null;
      noteInput.value = '';
      const p0 = await fetch('tests/romaine_p0.json').then((r) => r.json());
      inputHan.value = p0.items[0].han;
      runConvert();
    });

    document.getElementById('evalP0Btn').addEventListener('click', async () => {
      if (!engine.ready) return;
      const p0 = await fetch('tests/romaine_p0.json').then((r) => r.json());
      let goldCount = 0;
      let hitCount = 0;
      for (const it of p0.items) {
        const gSyls = it.tokens.filter((t) => !t.punct).flatMap((t) => t.hpp.trim().toLowerCase().split(/[\s'-]+/));
        const pToks = engine.segmentAndConvert(it.han);
        const pSyls = pToks.filter((t) => !t.punct).flatMap((t) => t.hpp.trim().toLowerCase().split(/[\s'-]+/));
        const m = gSyls.length, n = pSyls.length;
        const dp = Array.from({ length: m + 1 }, () => new Uint32Array(n + 1));
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            dp[i][j] = gSyls[i - 1] === pSyls[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
        goldCount += m;
        hitCount += dp[m][n];
      }
      const pct = ((hitCount / goldCount) * 100).toFixed(1);
      statusLine.textContent = `P0 基準測試（${p0.items.length} 筆）：音節讀音正確率 ${hitCount}/${goldCount} (${pct}%)`;
    });

    function toggleTokenCase(idx) {
      const tok = currentTokens[idx];
      if (!tok || !tok.hpp) return;
      const isHyphenCompound = tok.sylBoundaries && tok.sylBoundaries.includes('hyphen');
      if (isHyphenCompound) {
        const syls = tok.hpp.trim().split(/\s+/).filter(Boolean);
        const firstChar = syls[0] ? syls[0].charAt(0) : '';
        const toUpper = firstChar === firstChar.toLowerCase();
        tok.hpp = syls
          .map((s) => (toUpper ? s.charAt(0).toUpperCase() + s.slice(1) : s.charAt(0).toLowerCase() + s.slice(1)))
          .join(' ');
      } else {
        const first = tok.hpp.charAt(0);
        tok.hpp = (first !== first.toLowerCase() ? first.toLowerCase() : first.toUpperCase()) + tok.hpp.slice(1);
      }
      recordTokenManualOverride(idx, false, true);
      render();
    }

    function buildVerifiedEntry(id) {
      const comments = currentTokens
        .filter((t) => t.isComment)
        .map((t) => t.han.replace(/^%%|%%$/g, '').trim())
        .filter(Boolean);
      const entry = {
        id: id || `v-${Date.now()}`,
        dialect: engine.dialect,
        han: inputHan.value.trim(),
        tokens: currentTokens.map((t) => {
          if (t.isComment) return { han: t.han, comment: true };
          if (t.punct) return { han: t.han, punct: true, hpp: t.hpp };
          const obj = { han: t.han, hpp: t.hpp };
          if (t.uncertain) obj.uncertain = true;
          if (t.noSandhi) obj.no_sandhi = t.noSandhi;
          if (t.sylBoundaries && t.sylBoundaries.some((b) => b === 'hyphen' || b === 'space')) {
            obj.syl_boundaries = t.sylBoundaries;
          }
          return obj;
        }),
        joined_hpp: engine.formatTokensToHpp(currentTokens, joiningMode.value),
        status: 'verified',
        source: 'romaine-auto-poc',
        updated_at: new Date().toISOString(),
      };
      if (activeCertRef) {
        entry.cert_ref = {
          dialect: activeCertRef.dialect,
          level: activeCertRef.level,
          id: activeCertRef.id,
          category: activeCertRef.category,
          han: activeCertRef.han,
        };
      }
      const noteVal = noteInput.value.trim();
      if (noteVal) entry.note = noteVal;
      if (comments.length) entry.comments = comments;
      return entry;
    }

    async function loadVerifiedItemIntoEditor(item, origIdx, { scrollToTop = true } = {}) {
      const targetDialect = item.dialect || 'sixian';
      if (targetDialect !== engine.dialect) {
        dialectSelect.value = targetDialect;
        await loadDialect(targetDialect, false);
      }
      editingVerifiedId = item.id;
      editingVerifiedNum = origIdx + 1;
      activeCertRef = item.cert_ref
        ? {
            ...item.cert_ref,
            pureCjk: Array.from((item.han || '').replace(/%%[\s\S]*?%%/g, ''))
              .filter((c) => CJK_CHAR_TEST_RE.test(c))
              .join(''),
          }
        : null;
      updateSaveButtons();
      inputHan.value = item.han || '';
      noteInput.value = item.note || '';
      manualCharOverrides = new Map();
      prevPureCjk = [];
      let cjkIdx = 0;
      for (const tok of item.tokens || []) {
        if (tok.punct || tok.nonCjk) continue;
        const chars = Array.from(tok.han || '').filter((c) => CJK_CHAR_TEST_RE.test(c));
        const syls = (tok.hpp || '').trim().split(/\s+/).filter(Boolean);
        for (let k = 0; k < chars.length; k++) {
          prevPureCjk.push(chars[k]);
          const syl = syls[k] || '';
          const fc = syl.charAt(0);
          manualCharOverrides.set(cjkIdx, {
            ch: chars[k],
            syl: syl.toLowerCase(),
            isUpper: !!fc && fc !== fc.toLowerCase(),
            uncertain: !!tok.uncertain,
          });
          cjkIdx++;
        }
      }
      runConvert();
      statusLine.textContent = `已載入第 #${editingVerifiedNum} 筆黃金語料進行編輯。`;
      if (scrollToTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cleanCertSentence(raw) {
      return (raw || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').trim();
    }

    const CERT_LEVEL_INFO = {
      '基礎級': { 目錄級: '5', 目錄另級: '1', 檔級: '', 例外變數: '基例外音檔' },
      '初級': { 目錄級: '1', 檔級: '', 例外變數: '初例外音檔' },
      '中級': { 目錄級: '2', 檔級: '1', 例外變數: '中例外音檔' },
      '中高級': { 目錄級: '3', 檔級: '2', 例外變數: '中高例外音檔' },
      '高級': { 目錄級: '4', 檔級: '3', 例外變數: '高例外音檔' },
    };

    let certAudioPlayer = null;
    let certPlayingBtn = null;

    function applyCertAudioProxy(url) {
      if (!url || !url.startsWith('https://elearning.hakka.gov.tw/')) return url;
      const isLocal = (location.protocol === 'http:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.port !== '8788';
      const prefix = isLocal ? 'https://hakspring.pages.dev/audio-proxy?url=' : '/audio-proxy?url=';
      return prefix + encodeURIComponent(url);
    }

    function buildCertSentenceAudioUrl(row, dialectKey, levelName) {
      if (!row || !row.id || levelName === '高級') return null;
      const lvl = CERT_LEVEL_INFO[levelName];
      if (!lvl) return null;
      const 檔腔 = dialectKey === 'zhaoan' ? 'zh' : 'si';
      const 腔名 = dialectKey === 'zhaoan' ? '詔安' : '四縣';
      const fullLvlName = 腔名 + levelName;
      if (typeof getMissingAudioInfo === 'function') {
        const miss = getMissingAudioInfo(fullLvlName, row.category, row.id);
        if (miss && miss.sentence === false) return null;
      }
      const no = String(row.id).split('-');
      if (no.length < 2) return null;
      const no0 = Number(no[0]) <= 9 ? '0' + Number(no[0]) : no[0];
      const n1 = Number(no[1]);
      let mediaNo = n1 <= 9 ? '00' + n1 : n1 <= 99 ? '0' + n1 : String(n1);
      let mediaYr = '115';
      let pre112 = '';
      let dirLvl = lvl.目錄級;
      const exList = window[lvl.例外變數] || [];
      const ex = exList.find(([id]) => id === row.id);
      if (ex) {
        mediaYr = ex[1];
        mediaNo = ex[2];
        pre112 = 's/';
        if (lvl.目錄另級 !== undefined) dirLvl = lvl.目錄另級;
      }
      const dir = `${dirLvl}/${檔腔}/${pre112}${lvl.檔級}${檔腔}`;
      return applyCertAudioProxy(`https://elearning.hakka.gov.tw/hakka/files/cert/vocabulary/${mediaYr}/${dir}-${no0}-${mediaNo}s.mp3`);
    }

    function playCertAudio(url, btn) {
      if (!url) return;
      if (certAudioPlayer) {
        certAudioPlayer.pause();
        certAudioPlayer = null;
      }
      if (certPlayingBtn) {
        certPlayingBtn.classList.remove('playing');
        if (certPlayingBtn === btn) {
          certPlayingBtn = null;
          return;
        }
      }
      const audio = new Audio(url);
      certAudioPlayer = audio;
      certPlayingBtn = btn;
      btn.classList.add('playing');
      const cleanup = () => {
        btn.classList.remove('playing');
        if (certPlayingBtn === btn) certPlayingBtn = null;
        if (certAudioPlayer === audio) certAudioPlayer = null;
      };
      audio.addEventListener('ended', cleanup);
      audio.addEventListener('error', cleanup);
      audio.play().catch(cleanup);
    }

    async function loadCertSentence(idx) {
      if (idx < 0 || idx >= certFilteredRows.length) return;
      certActiveIdx = idx;
      const row = certFilteredRows[idx];
      const levelName = certLevelSelect.value;

      // Single Source of Truth：若此認證例句已有黃金語料記憶，直接載入黃金語料
      const verifiedList = loadVerified();
      let matchedIdx = -1;
      for (let i = verifiedList.length - 1; i >= 0; i--) {
        const ref = verifiedList[i].cert_ref;
        if (
          ref &&
          (ref.dialect || 'sixian') === engine.dialect &&
          ref.level === levelName &&
          ref.id === (row.id || '')
        ) {
          matchedIdx = i;
          break;
        }
      }

      if (matchedIdx !== -1) {
        await loadVerifiedItemIntoEditor(verifiedList[matchedIdx], matchedIdx, { scrollToTop: false });
      } else {
        const cleanedSent = cleanCertSentence(row.sentence);
        editingVerifiedId = null;
        editingVerifiedNum = 0;
        activeCertRef = {
          dialect: engine.dialect,
          level: levelName,
          id: row.id || '',
          category: row.category || '',
          han: row.han || '',
          pureCjk: Array.from(cleanedSent).filter((c) => CJK_CHAR_TEST_RE.test(c)).join(''),
        };
        updateSaveButtons();
        manualCharOverrides = new Map();
        prevPureCjk = [];
        noteInput.value = '';
        inputHan.value = cleanedSent;
        runConvert();
      }

      certCounter.textContent = `${idx + 1} / ${certFilteredRows.length}`;
      certActiveMeta.style.display = 'block';
      certActiveMeta.innerHTML = '';
      const topRow = document.createElement('div');
      topRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:8px;';
      const line1 = document.createElement('div');
      line1.innerHTML = `<strong>${row.id || ''} ${row.han || ''}</strong>`;
      if (matchedIdx !== -1) {
        const badge = document.createElement('span');
        badge.className = 'cert-verified-badge';
        badge.textContent = `✓ 已載入黃金語料 #${matchedIdx + 1}`;
        line1.appendChild(badge);
      }
      topRow.appendChild(line1);
      const audioUrl = buildCertSentenceAudioUrl(row, engine.dialect, levelName);
      if (audioUrl) {
        const audioBtn = document.createElement('button');
        audioBtn.type = 'button';
        audioBtn.className = 'cert-audio-btn';
        audioBtn.textContent = '🔊 聽例句';
        audioBtn.onclick = () => playCertAudio(audioUrl, audioBtn);
        topRow.appendChild(audioBtn);
      }
      const line2 = document.createElement('div');
      line2.className = 'cert-sent-sub';
      line2.textContent = `華語翻譯：${cleanCertSentence(row.translation) || '（無）'}`;
      certActiveMeta.appendChild(topRow);
      certActiveMeta.appendChild(line2);

      for (const el of certSentList.querySelectorAll('.cert-sent-row')) {
        el.classList.toggle('active', Number(el.dataset.idx) === idx);
      }
      const activeEl = certSentList.querySelector(`.cert-sent-row[data-idx="${idx}"]`);
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
    }

    function getVerifiedCertMap() {
      const map = new Map();
      for (const it of loadVerified()) {
        if (it.cert_ref && it.cert_ref.id) {
          map.set(`${it.cert_ref.dialect || 'sixian'}\t${it.cert_ref.level || ''}\t${it.cert_ref.id}`, it);
        }
      }
      return map;
    }

    function extractInlineBoundaryOps(rawHan) {
      const ops = new Map();
      const cleaned = (rawHan || '').replace(/%%[\s\S]*?%%/g, '');
      const chars = Array.from(cleaned);
      let cjkIdx = -1;
      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        if (CJK_CHAR_TEST_RE.test(ch)) {
          cjkIdx++;
        } else if ((ch === '+' || ch === '=') && cjkIdx >= 0) {
          ops.set(cjkIdx, ch === '+' ? 'space' : 'hyphen');
        }
      }
      return ops;
    }

    function extractInlineNoSandhiSet(rawHan) {
      const set = new Set();
      const cleaned = (rawHan || '').replace(/%%[\s\S]*?%%/g, '');
      const chars = Array.from(cleaned);
      let cjkIdx = -1;
      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        if (CJK_CHAR_TEST_RE.test(ch)) {
          cjkIdx++;
        } else if ((ch === '#' || ch === '~') && cjkIdx >= 0) {
          set.add(cjkIdx);
        }
      }
      return set;
    }

    function renderCertHppLine(hppEl, verifiedItem) {
      if (!hppEl) return;
      if (!verifiedItem || (!verifiedItem.joined_hpp && !(verifiedItem.tokens && verifiedItem.tokens.length))) {
        hppEl.textContent = '';
        hppEl.style.display = 'none';
        return;
      }
      if (verifiedItem.tokens && verifiedItem.tokens.length) {
        const inlineOps = extractInlineBoundaryOps(verifiedItem.han);
        const inlineNoSandhi = extractInlineNoSandhiSet(verifiedItem.han);
        let pureIdx = 0;
        const toks = verifiedItem.tokens.map((t) => {
          if (t.punct || t.nonCjk || t.comment) return t;
          const cLen = Array.from(t.han || '').filter((c) => CJK_CHAR_TEST_RE.test(c)).length;
          let sb = t.sylBoundaries || t.syl_boundaries;
          if (!sb && cLen > 1 && inlineOps.size > 0) {
            const derived = new Array(cLen - 1).fill('normal');
            let hasOp = false;
            for (let k = 0; k < cLen - 1; k++) {
              const op = inlineOps.get(pureIdx + k);
              if (op) {
                derived[k] = op;
                hasOp = true;
              }
            }
            if (hasOp) sb = derived;
          }
          let ns = t.noSandhi || t.no_sandhi;
          if (!ns && inlineNoSandhi.size > 0) {
            const flags = [];
            for (let k = 0; k < cLen; k++) {
              flags.push(inlineNoSandhi.has(pureIdx + k));
            }
            if (flags.some(Boolean)) ns = flags;
          }
          pureIdx += cLen;
          return {
            ...t,
            noSandhi: ns,
            sylBoundaries: sb,
          };
        });
        if (sandhiToggle.checked && engine.sandhiRules) {
          hppEl.innerHTML = engine.formatTokensToSandhiHtml(toks, joiningMode.value);
        } else {
          hppEl.textContent = engine.formatTokensToHpp(toks, joiningMode.value);
        }
      } else {
        hppEl.textContent = verifiedItem.joined_hpp || '';
      }
      hppEl.style.display = 'block';
    }

    function refreshCertVerifiedHighlights() {
      const vMap = getVerifiedCertMap();
      const useItalic = RomaineAutoEngine.getUnverifiedItalic();
      let doneCount = 0;
      for (const el of certSentList.querySelectorAll('.cert-sent-row')) {
        const key = el.dataset.certKey || '';
        const item = vMap.get(key);
        const isDone = Boolean(item);
        if (isDone) doneCount++;
        el.classList.toggle('verified', isDone);
        el.classList.toggle('unverified-italic', !isDone && useItalic);
        const badge = el.querySelector('.cert-verified-badge');
        if (badge) badge.style.display = isDone ? 'inline-block' : 'none';
        renderCertHppLine(el.querySelector('.cert-sent-hpp'), item);
      }
      if (certActiveIdx === -1) {
        certCounter.textContent = `共 ${certFilteredRows.length} 句（已校 ${doneCount} 句）`;
      }
    }

    function renderCertSentences() {
      const lvlObj = engine.certLevels.find((l) => l.level === certLevelSelect.value) || engine.certLevels[0];
      const levelName = lvlObj ? lvlObj.level : certLevelSelect.value;
      const cat = certCategorySelect.value;
      certFilteredRows = lvlObj ? lvlObj.rows.filter((r) => !cat || r.category === cat) : [];
      certActiveIdx = -1;
      certActiveMeta.style.display = 'none';
      certSentList.innerHTML = '';
      const verifiedMap = getVerifiedCertMap();
      const useItalic = RomaineAutoEngine.getUnverifiedItalic();
      let doneCount = 0;

      certFilteredRows.forEach((row, idx) => {
        const certKey = `${engine.dialect}\t${levelName}\t${row.id || ''}`;
        const verifiedItem = row.id ? verifiedMap.get(certKey) : null;
        const isDone = Boolean(verifiedItem);
        if (isDone) doneCount++;
        const div = document.createElement('div');
        div.className = 'cert-sent-row' + (isDone ? ' verified' : useItalic ? ' unverified-italic' : '');
        div.dataset.idx = String(idx);
        div.dataset.certKey = certKey;

        const textWrap = document.createElement('div');
        textWrap.className = 'cert-sent-text';
        const main = document.createElement('div');
        main.className = 'cert-sent-main';
        main.textContent = `${row.id ? row.id + ' ' : ''}[${row.han}] ${cleanCertSentence(row.sentence)}`;
        const badge = document.createElement('span');
        badge.className = 'cert-verified-badge';
        badge.textContent = '✓ 已校';
        badge.style.display = isDone ? 'inline-block' : 'none';
        main.appendChild(badge);
        const hppLine = document.createElement('div');
        hppLine.className = 'cert-sent-hpp';
        renderCertHppLine(hppLine, verifiedItem);
        const sub = document.createElement('div');
        sub.className = 'cert-sent-sub';
        sub.textContent = cleanCertSentence(row.translation);
        textWrap.appendChild(main);
        textWrap.appendChild(hppLine);
        textWrap.appendChild(sub);

        const btnGroup = document.createElement('div');
        btnGroup.style.cssText = 'display:flex;gap:6px;flex-shrink:0;';

        const audioUrl = buildCertSentenceAudioUrl(row, engine.dialect, levelName);
        if (audioUrl) {
          const audioBtn = document.createElement('button');
          audioBtn.type = 'button';
          audioBtn.className = 'cert-audio-btn';
          audioBtn.textContent = '🔊';
          audioBtn.title = '播放例句音檔';
          audioBtn.onclick = (e) => {
            e.stopPropagation();
            playCertAudio(audioUrl, audioBtn);
          };
          btnGroup.appendChild(audioBtn);
        }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '載入';
        btn.onclick = () => loadCertSentence(idx);
        btnGroup.appendChild(btn);

        div.appendChild(textWrap);
        div.appendChild(btnGroup);
        certSentList.appendChild(div);
      });
      certCounter.textContent = `共 ${certFilteredRows.length} 句（已校 ${doneCount} 句）`;
    }

    function populateCertCategories() {
      const lvlObj = engine.certLevels.find((l) => l.level === certLevelSelect.value) || engine.certLevels[0];
      const cats = [];
      if (lvlObj) {
        for (const r of lvlObj.rows) {
          if (r.category && !cats.includes(r.category)) cats.push(r.category);
        }
      }
      certCategorySelect.innerHTML = '';
      for (const c of cats) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        certCategorySelect.appendChild(opt);
      }
      renderCertSentences();
    }

    function initCertLoader() {
      certLevelSelect.innerHTML = '';
      for (const l of engine.certLevels) {
        const opt = document.createElement('option');
        opt.value = l.level;
        opt.textContent = l.level;
        certLevelSelect.appendChild(opt);
      }
      populateCertCategories();
    }

    certLevelSelect.addEventListener('change', populateCertCategories);
    certCategorySelect.addEventListener('change', renderCertSentences);
    certPrevBtn.addEventListener('click', () => {
      if (!certFilteredRows.length) return;
      loadCertSentence(certActiveIdx > 0 ? certActiveIdx - 1 : 0);
    });
    certNextBtn.addEventListener('click', () => {
      if (!certFilteredRows.length) return;
      const next = certActiveIdx + 1 < certFilteredRows.length ? certActiveIdx + 1 : 0;
      loadCertSentence(next);
    });

    async function loadDialect(dialect, shouldConvert = true) {
      statusLine.textContent = `載入 ${dialect === 'zhaoan' ? '詔安' : '四縣'} 詞庫中…`;
      await engine.init('.', dialect);
      initCertLoader();
      const learnMsg = engine.learnedCount ? `、已即時學習 ${engine.learnedCount} 筆黃金語料` : '';
      statusLine.textContent = `[${engine.dialectLabel}] 詞庫載入完成：${engine.lexicon.size} 詞條（含補字典）、${engine.prefs.size} 多音偏好表${learnMsg}。`;
      if (shouldConvert && inputHan.value.trim()) {
        manualCharOverrides = new Map();
        prevPureCjk = [];
        runConvert();
      }
    }

    const DIALECT_STORAGE_KEY = 'romaineAutoDialect';
    const savedDialect = localStorage.getItem(DIALECT_STORAGE_KEY);
    if (savedDialect === 'sixian' || savedDialect === 'zhaoan') {
      dialectSelect.value = savedDialect;
    }

    dialectSelect.addEventListener('change', () => {
      localStorage.setItem(DIALECT_STORAGE_KEY, dialectSelect.value);
      loadDialect(dialectSelect.value, true).catch((err) => {
        statusLine.textContent = `切換腔調失敗：${err.message}`;
      });
    });

    updateVerifiedBadge();
    loadDialect(dialectSelect.value, false).catch((err) => {
      statusLine.textContent = `載入失敗（請透過本機 HTTP 伺服器開啟）：${err.message}`;
    });
  </script>
</body>
</html>
