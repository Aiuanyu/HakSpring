name: Sandhi fixtures

on:
  push:
    paths:
      - 'main.js'
      - 'sandhi_rules.json'
      - 'reverse_tone_mapping.json'
      - 'tests/sandhi_fixture_test.js'
      - 'tests/cert_advanced_repeat_test.js'
      - 'js/pfs-converter.js'
      - 'js/gip-converter.js'
      - 'pages/pfs.md'
      - 'tests/pfs_converter_test.js'
      - 'tests/pfs_sandhi_test.js'
      - 'tests/gip_converter_test.js'
      - 'tests/gip_sandhi_test.js'
      - 'tests/gip_borrow_test.js'
      - 'js/romaine-join.js'
      - 'tests/romaine_join_test.js'
      - 'tests/pfs_to_hpp_test.js'
      - 'data/cert/113四*.json'
      - 'js/gip-superscript.js'
      - 'tests/gip_superscript_test.js'
      - '.github/workflows/sandhi-test.yml'
  pull_request:
    paths:
      - 'main.js'
      - 'sandhi_rules.json'
      - 'reverse_tone_mapping.json'
      - 'tests/sandhi_fixture_test.js'
      - 'tests/cert_advanced_repeat_test.js'
      - 'js/pfs-converter.js'
      - 'js/gip-converter.js'
      - 'pages/pfs.md'
      - 'tests/pfs_converter_test.js'
      - 'tests/pfs_sandhi_test.js'
      - 'tests/gip_converter_test.js'
      - 'tests/gip_sandhi_test.js'
      - 'tests/gip_borrow_test.js'
      - 'js/romaine-join.js'
      - 'tests/romaine_join_test.js'
      - 'tests/pfs_to_hpp_test.js'
      - 'data/cert/113四*.json'
      - 'js/gip-superscript.js'
      - 'tests/gip_superscript_test.js'
      - '.github/workflows/sandhi-test.yml'

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run sandhi fixture regression
        run: node tests/sandhi_fixture_test.js
      - name: Run CERT Advanced repeat tests
        run: node tests/cert_advanced_repeat_test.js
      - name: Run PFS converter tests
        run: node tests/pfs_converter_test.js
      - name: Run PFS sandhi tests
        run: node tests/pfs_sandhi_test.js
      - name: Run GIP converter tests
        run: node tests/gip_converter_test.js
      - name: Run GIP sandhi tests
        run: node tests/gip_sandhi_test.js
      - name: Run GIP borrow tests
        run: node tests/gip_borrow_test.js
      - name: Run Romaine join tests
        run: node tests/romaine_join_test.js
      - name: PFS → HPP / GIP tests
        run: node tests/pfs_to_hpp_test.js
      - name: Run GIP superscript tests
        run: node tests/gip_superscript_test.js
