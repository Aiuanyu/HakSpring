name: Version bump check

# 改資料愛 bump data/data_version.json，改 js/css 愛 bump index.html 个 ?v=，
# 無就手機（IndexedDB／瀏覽器快取）永遠看無新資料摎新程式。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 決定比較基準
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 檢查版本號有 bump
        run: |
          BASE="${{ steps.base.outputs.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          fail=0

          if echo "$CHANGED" | grep -E '^data/.*\.(csv|json)$' | grep -qv '^data/data_version.json$'; then
            if ! echo "$CHANGED" | grep -qx 'data/data_version.json'; then
              echo "::error file=data/data_version.json::改著 data/ 底下个資料，但係無 bump data/data_version.json 个 version（YYYYMMDDHH）"
              fail=1
            fi
          fi

          if echo "$CHANGED" | grep -E '^(main\.js|style\.css|js/.*\.js)$' | grep -q .; then
            if ! echo "$CHANGED" | grep -qx 'index.html'; then
              echo "::error file=index.html::改著 js／css，但係無更新 index.html 載入標籤个 ?v= 查詢字串"
              fail=1
            fi
          fi
          exit $fail
