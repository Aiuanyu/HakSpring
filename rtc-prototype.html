<!DOCTYPE html>
<html lang="hak-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rtc 多層標音試作</title>
<!-- 試作頁：認證詞彙標音有斜線時，漢字淨留一份，每種讀音用 <rtc> 多層 <rt> 完整展開。
     淨 Firefox 系支援 <rtc>；其他瀏覽器會見著亂掉（愛行）个畫面，毋係 bug。
     試完決定做法就做得刪掉這隻檔案。 -->
<style>
  :root {
    --bg: #f7f5ef; --fg: #222; --card: #fff; --line: #d8d3c4; --accent: #2f6f4f; --muted: #666;
    --code-bg: #efece3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1d1f; --fg: #e6e6e6; --card: #232426; --line: #3a3c3f; --accent: #8fd0a8; --muted: #aaa;
      --code-bg: #2c2d30;
    }
  }
  body { background: var(--bg); color: var(--fg); font-family: Iansui, '霞鶩文楷 TC', 'LXGW WenKai', serif;
         font-size: 20px; line-height: 1.6; margin: 0; padding: 16px; }
  h1 { font-size: 1.3em; margin: 0 0 .3em; }
  p.note { color: var(--muted); font-size: .8em; margin: .2em 0 1em; }
  .controls { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
              margin-bottom: 16px; font-size: .85em; display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .controls label { display: inline-flex; align-items: center; gap: 6px; }
  .controls select, .controls input { font: inherit; }
  #supportBanner { display: none; background: #fde8e8; color: #7a1d1d; border-radius: 6px; padding: 6px 10px;
                   margin-bottom: 12px; font-size: .8em; }
  table { border-collapse: collapse; width: 100%; background: var(--card); }
  th, td { border: 1px solid var(--line); padding: 8px 12px; vertical-align: top; text-align: left; }
  th { font-size: .75em; color: var(--muted); font-weight: normal; }
  td.case { font-size: .75em; color: var(--muted); width: 9em; }
  td.demo { min-width: 9em; }
  td.narrow { max-width: 6em; }
  code { display: block; background: var(--code-bg); border-radius: 4px; padding: 4px 6px; margin-top: 6px;
         font-size: .62em; line-height: 1.4; word-break: break-all; font-family: ui-monospace, monospace; }

  /* 展示用 ruby 基本樣式（--rt-size 愛摎站上相仿） */
  ruby { ruby-align: center; }
  rt { font-size: .6em; }
  /* 第二層以後（rtc）个位置，由上背控制項切換 */
  rtc { ruby-position: var(--rtc-pos, under); }
  /* 字級校正：Firefox UA 會把 rtc 本身縮小，裡肚个 rt 又縮一擺（雙重縮小）。
     rtc 還原成 1em，rt 个字級就摎第一層（直接放 ruby 下个 rt）一致。 */
  rtc { font-size: 1em; }
  /* 變調 ruby（嵌在 rt 裡肚） */
  ruby.sandhi-t53 { color: mediumvioletred; }
  ruby.sandhi-t53 rt { font-size: .7em; }
  /* ── 變調 ruby 試法（作用在 <td class="sN">） ── */
  /* S1：加高 rt 行高，替嵌在 rt 裡肚个變調數字留位 */
  .s1 rt { line-height: 2.6; }
  /* S2：第二層以後放漢字下背（under），避免摎第一層个變調數字相撞 */
  .s2 rtc { ruby-position: under; }
  /* S4：嵌在 rt 个變調數字改放音節下背 */
  .s4 rt ruby > rt { ruby-position: under; }
  /* S3：免巢狀 ruby，改用上標 */
  sup.sd { font-size: .6em; color: mediumvioletred; margin-left: 1px; }
  /* phonetic-only：漢字 base 零高度 */
  ruby.variant-ruby-phonetic-only > .zero { font-size: 0; line-height: 0; }
</style>
</head>
<body>
<h1>rtc 多層標音試作（Firefox 系）</h1>
<p class="note">認證詞彙標音有斜線者：漢字淨一份，各讀音完整展開成多層 <code style="display:inline;margin:0;padding:0 4px">&lt;rtc&gt;&lt;rt&gt;</code>。左爿係「現在」个斜線文字，右爿係「rtc 展開」。</p>

<div id="supportBanner">這隻瀏覽器好像毋支援 &lt;rtc&gt;（毋係 Firefox 系？），右爿畫面做毋準。</div>

<div class="controls">
  <label>第二層以後位置
    <select id="posSel">
      <option value="under">under（漢字下背，目前採用）</option>
      <option value="over">over（疊在第一層上背）</option>
      <option value="alternate">alternate</option>
    </select>
  </label>
  <label>字級 <input id="sizeRange" type="range" min="14" max="32" value="20"> <span id="sizeVal">20</span>px</label>
  <label><input id="siteCss" type="checkbox"> 套用站上 style.css（看真實樣式影響）</label>
</div>

<table id="tbl">
  <thead><tr><th>案例</th><th>現在（斜線文字）</th><th>rtc 展開</th><th>窄欄（6em）</th></tr></thead>
  <tbody></tbody>
</table>

<h1 style="margin-top:1.4em">變調 ruby 試法</h1>
<p class="note">同一詞「溜走」，第一層、第二層各帶變調。S0 係現況（巢狀 ruby 放 rt 裡肚）；S1～S4 係幾種處理，看哪種毋會相撞、毋會撐歪。</p>
<table id="tbl2">
  <thead><tr><th>試法</th><th>rtc 展開</th><th>窄欄（6em）</th></tr></thead>
  <tbody></tbody>
</table>

<script>
  // 每筆：base（漢字）、readings（各完整讀音，可含變調 ruby HTML）、slash（現在的斜線字串）
  const sandhi = (t, n) => `<ruby class="sandhi-t53">${t}<rt>${n}</rt></ruby>`;
  const CASES = [
    { name: '整詞並列', base: '溜走', slash: 'tiu zèu/liu zèu', readings: ['tiu zèu', 'liu zèu'] },
    { name: '單音節異讀（尾字相同）', base: '欣賞', slash: 'hím/hiún sòng', readings: ['hím sòng', 'hiún sòng'] },
    { name: '單字異讀', base: '拔', slash: 'bad/pad', readings: ['bad', 'pad'] },
    { name: '中間音節異讀', base: '起懶根', slash: 'hì lán/nán gín', readings: ['hì lán gín', 'hì nán gín'] },
    { name: '四種讀音（四層）', base: '外背', slash: 'ngoi/ngo/no/lo boi', readings: ['ngoi boi', 'ngo boi', 'no boi', 'lo boi'] },
    { name: '長詞（4 字）', base: '咚咚咚咚', slash: 'dǔng dǔng dung dung/dǔng dúng dùng dùng', readings: ['dǔng dǔng dung dung', 'dǔng dúng dùng dùng'] },
    { name: '含變調 ruby', base: '溜走', slash: `${sandhi('tiu', '53')} zèu/liu zèu`, readings: [`${sandhi('tiu', '53')} zèu`, 'liu zèu'] },
    { name: 'phonetic-only（無漢字 base）', base: null, slash: 'cii/sii kon', readings: ['cii kon', 'sii kon'] },
    { name: '無斜線（對照）', base: '發燒', slash: 'fàd séu', readings: ['fàd séu'] },
  ];

  function rtcHtml(c) {
    const [first, ...rest] = c.readings;
    const cls = c.base === null ? ' class="variant-ruby-phonetic-only"' : '';
    const base = c.base === null ? '<span class="zero">&nbsp;</span>' : c.base;
    return `<ruby${cls}>${base}<rt>${first}</rt>` + rest.map(r => `<rtc><rt>${r}</rt></rtc>`).join('') + '</ruby>';
  }
  function currentHtml(c) {
    const cls = c.base === null ? ' class="variant-ruby-phonetic-only"' : '';
    const base = c.base === null ? '<span class="zero">&nbsp;</span>' : c.base;
    return `<ruby${cls}>${base}<rt>${c.slash}</rt></ruby>`;
  }
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  const tbody = document.querySelector('#tbl tbody');
  CASES.forEach(c => {
    const html = rtcHtml(c);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="case">${c.name}</td>
      <td class="demo">${currentHtml(c)}</td>
      <td class="demo">${html}<code>${esc(html)}</code></td>
      <td class="demo narrow">${html}</td>`;
    tbody.appendChild(tr);
  });

  // 變調試法
  const sd = (t, n) => `<ruby class="sandhi-t53">${t}<rt>${n}</rt></ruby>`;
  const sup = (t, n) => `<span style="color:mediumvioletred">${t}<sup class="sd">${n}</sup></span>`;
  const nested = { base: '溜走', readings: [`${sd('tiu', '53')} zèu`, `${sd('liu', '53')} zèu`] };
  const supVer = { base: '溜走', readings: [`${sup('tiu', '53')} zèu`, `${sup('liu', '53')} zèu`] };
  const VARS = [
    ['S0 現況（巢狀 ruby）', '', nested],
    ['S1 rt 加高行高', 's1', nested],
    ['S2 第二層以後 under', 's2', nested],
    ['S3 免巢狀，用上標 sup', '', supVer],
    ['S4 變調數字放音節下背', 's4', nested],
  ];
  const tb2 = document.querySelector('#tbl2 tbody');
  VARS.forEach(([name, cls, c]) => {
    const html = rtcHtml(c);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="case">${name}</td>
      <td class="demo ${cls}">${html}</td>
      <td class="demo narrow ${cls}">${html}</td>`;
    tb2.appendChild(tr);
  });

  // 控制項
  document.getElementById('posSel').addEventListener('change', e =>
    document.documentElement.style.setProperty('--rtc-pos', e.target.value));
  document.getElementById('sizeRange').addEventListener('input', e => {
    document.body.style.fontSize = e.target.value + 'px';
    document.getElementById('sizeVal').textContent = e.target.value;
  });
  let siteLink = null;
  document.getElementById('siteCss').addEventListener('change', e => {
    if (e.target.checked) {
      siteLink = document.createElement('link');
      siteLink.rel = 'stylesheet';
      siteLink.href = 'style.css';
      document.head.appendChild(siteLink);
    } else if (siteLink) { siteLink.remove(); siteLink = null; }
  });

  // 偵測 <rtc>：Firefox 會把 rtc 當做 display: ruby-text-container
  const probe = document.createElement('rtc');
  document.body.appendChild(probe);
  if (getComputedStyle(probe).display !== 'ruby-text-container') {
    document.getElementById('supportBanner').style.display = 'block';
  }
  probe.remove();
</script>
</body>
</html>
